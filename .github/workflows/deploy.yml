name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.app }}:${{ github.sha }}

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-and-push-images
    if: github.ref == 'refs/heads/main'
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Deploy to EKS dev
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_DEV_CLUSTER }} --region ${{ secrets.AWS_REGION }}
          kubectl apply -f k8s/dev/namespace.yaml
          kubectl apply -f k8s/dev/backend.yaml
          kubectl apply -f k8s/dev/frontend.yaml
          kubectl apply -f k8s/dev/ingress.yaml

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build-and-push-images
    if: startsWith(github.ref, 'refs/tags/v')
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Deploy to EKS prod
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_PROD_CLUSTER }} --region ${{ secrets.AWS_REGION }}
          kubectl apply -f k8s/prod/namespace.yaml
          kubectl apply -f k8s/prod/backend.yaml
          kubectl apply -f k8s/prod/frontend.yaml
          kubectl apply -f k8s/prod/ingress.yaml
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
