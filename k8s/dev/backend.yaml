apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: books-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/nuxt-nest-learning-backend:dev
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: backend-env
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: books-dev
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
